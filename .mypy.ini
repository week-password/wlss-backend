[mypy]

files = api,src,tests

exclude =
    (?x)(
        ^tests/test.*$  # skip tests
        | ^tests/conftest.*$  # skip fixtures
    )

plugins = pydantic.mypy

strict = True


[mypy-apscheduler.*]

ignore_missing_imports = True


[mypy-minio.*]

ignore_missing_imports = True


[mypy-varname.*]

ignore_missing_imports = True
